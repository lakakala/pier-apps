{# Pier uses StrictUndefined. Invalid inputs deliberately fail before download. #}
{%- if not (API_KEY | trim) -%}
{{ API_KEY_MUST_NOT_BE_EMPTY }}
{%- endif -%}
{%- if not (MANAGEMENT_KEY | trim) -%}
{{ MANAGEMENT_KEY_MUST_NOT_BE_EMPTY }}
{%- endif -%}
{%- set port = PORT | int -%}
{%- if port < 1 or port > 65535 or PORT != (port | string) -%}
{{ PORT_MUST_BE_A_DECIMAL_INTEGER_FROM_1_TO_65535 }}
{%- endif -%}
# Managed by Pier. A new deployment or rollback replaces the runtime copy.
config-version: 8

server:
  host: "127.0.0.1"
  port: {{ port }}
  tls:
    enable: false
  discovery:
    enabled: false

management:
  allow-remote: false
  secret-key: {{ MANAGEMENT_KEY | tojson }}
  disable-control-panel: false
  disable-auto-update-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

access:
  api-keys:
    - {{ API_KEY | tojson }}

oauth:
  auth-dir: "auths"

routing:
  strategy: "round-robin"
  retry:
    request-retry: 3
    max-retry-interval: 30

observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false
    error-logs-max-files: 10
  pprof:
    enable: false

plugins:
  enabled: false
  dir: "plugins"

